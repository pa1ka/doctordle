<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <meta name="description" content="Ежедневная диагностическая головоломка для врачей. Клинический случай, пять подсказок и шесть попыток.">
  <title>Докторли — клинический случай дня</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=13">
  <script type="module" src="/app.js?v=13"></script>
</head>
<body>
  <a class="skip-link" href="#game">Перейти к случаю</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="/" aria-label="Докторли — на главную"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M11 3h6v8h8v6h-8v8h-6v-8H3v-6h8z" fill="currentColor"/></svg></span><span>докторли</span></a>
    <nav class="mode-tabs" aria-label="Режим игры"><button class="mode-tab active" id="daily-tab" aria-pressed="true">Случай дня</button><button class="mode-tab" id="practice-tab" aria-pressed="false">Архив</button></nav>
    <div class="header-actions">
      <button class="icon-button" id="stats-button" aria-label="Статистика" title="Статистика"><svg viewBox="0 0 24 24"><path d="M5 19v-6m7 6V5m7 14V9"/></svg></button>
      <button class="icon-button" id="help-button" aria-label="Как играть" title="Как играть"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.8 9a2.3 2.3 0 0 1 4.5.7c0 1.7-2.3 1.7-2.3 3.3M12 16.5h.01"/></svg></button>
      <button class="icon-button" id="theme-button" aria-label="Включить тёмную тему" title="Сменить тему"><svg viewBox="0 0 24 24"><path d="M20 13.2A8.5 8.5 0 0 1 10.8 4a8.5 8.5 0 1 0 9.2 9.2Z"/></svg></button>
    </div>
  </div></header>
  <main class="page-shell">
    <section id="game" class="game-column" aria-label="Угадайте диагноз">
      <button id="archive-return" class="text-button" hidden>← К архиву</button><div class="game-tools"><button id="bookmark-button" class="text-button">☆ Сохранить</button></div><div class="board-topline"><span class="case-number" id="case-number">КЛИНИЧЕСКИЙ СЛУЧАЙ</span><time id="case-date"></time></div>
      <details id="case-context" open><summary id="case-context-label" hidden>Условие и подсказки</summary><div class="clinical-layout"><article class="patient-card"><div class="section-label" id="case-specialty">Клиническая картина</div>
        <div class="patient-top"><h1 id="patient-meta"></h1></div>
        <p id="complaint"></p>
      </article>
      <div class="diagnostic-panel"><div class="clue-heading"><h2>Подсказки</h2><span id="clue-count">0 / 5</span></div>
      <ol class="clues" id="clues" aria-label="Пять подсказок"></ol>
      <div class="answer-area" id="answer-area">
        <div class="answer-heading"><div class="attempt-counter"><div class="attempt-dots" id="attempt-dots" aria-hidden="true"></div><span id="attempt-count">Попытка 1 / 6</span></div></div>
        <form id="guess-form" autocomplete="off" novalidate><div class="input-row">
          <div class="search-wrap"><svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="diagnosis-input" type="text" placeholder="Ваш вариант ответа" aria-label="Ответ" role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" aria-describedby="input-hint" maxlength="140"><ul id="suggestions" role="listbox" aria-label="Диагнозы" hidden></ul></div>
          <button class="submit-button" id="submit-button" type="submit">Проверить<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button>
        </div></form>
        <button id="skip-button" type="button" class="text-button skip-button">Открыть подсказку</button><p class="input-hint" id="input-hint">Ошибка открывает следующую подсказку.</p>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
        <div class="guess-history" id="guess-history" aria-label="История ответов"></div>
      </div>
      </div></div></details>
      <section id="result" class="result" aria-live="polite" hidden></section>
      <p id="next-daily" class="next-daily" hidden>Новый случай через <span id="countdown"></span></p>
    </section>
    <footer class="site-footer"><span></span><button id="about-button">О проекте</button></footer>
  </main>
  <dialog id="modal"><div class="modal-header"><span class="modal-brand">докторли.</span><button class="icon-button" id="close-modal" aria-label="Закрыть окно"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="modal-body"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">Для игры необходимо включить JavaScript.</p></noscript>
</body>
</html>
